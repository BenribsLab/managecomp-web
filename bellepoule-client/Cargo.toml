[package]
name = "bellepoule-client"
description = "Client web de BellePoule (navigateur, WebAssembly)"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
gloo-net = { version = "0.6", features = ["http", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
js-sys = "0.3"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Location", "Storage", "File", "FileList", "Blob", "HtmlInputElement", "HtmlElement", "HtmlIFrameElement", "Document", "Element", "Url", "DataTransfer", "DragEvent", "KeyboardEvent", "DomTokenList", "PointerEvent", "MouseEvent", "Node", "NodeList", "Clipboard", "History", "Navigator", "Performance", "AudioContext", "BaseAudioContext", "AudioNode", "AudioDestinationNode", "AudioScheduledSourceNode", "OscillatorNode", "AudioParam", "GainNode"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
