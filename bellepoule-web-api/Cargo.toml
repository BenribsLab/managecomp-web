[workspace]
resolver = "2"
members = [".", "bp-core", "bp-net", "marshaller"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

# Dépendances du cœur BellePoule (copie autonome de `bp-core`).
[workspace.dependencies]
roxmltree = "0.20"
encoding_rs = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
csv = "1"
md-5 = "0.10"
sha1 = "0.10"

[package]
name = "bellepoule-web-api"
description = "API web de BellePoule : création et gestion des compétitions"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bp-core = { path = "bp-core" }
marshaller = { path = "marshaller" }
bp-net = { path = "bp-net" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
serde = { workspace = true }
serde_json = { workspace = true }
roxmltree = { workspace = true }
chrono = { workspace = true }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argon2 = { version = "0.5", features = ["std"] }

[profile.release]
strip = true
